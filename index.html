<html lang="zh-CN">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WordVault · 不背单词</title>
<style>
  :root {
    --bg: #0d0d1a;
    --surface: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.06);
    --text: #e8e8f0;
    --text-dim: #7a7a96;
    --green: #34d399;
    --amber: #f59e0b;
    --red: #ef4444;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --pink: #f472b6;
    --card-bg: #15152a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(139,92,246,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(59,130,246,0.06) 0%, transparent 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex; justify-content: center; padding: 12px;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .app { width:100%; max-width:420px; display:flex; flex-direction:column; min-height:100vh; }

  .top-bar { display:flex; align-items:center; justify-content:space-between; padding:20px 0 12px; }
  .top-bar h1 { font-size:22px; font-weight:700; letter-spacing:-0.4px;
    background:linear-gradient(135deg,#a78bfa,#60a5fa);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .top-btn { width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim); font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .top-btn:hover { background:rgba(255,255,255,0.08); color:var(--text); }

  .settings-panel { background:rgba(20,20,40,0.95); border:1px solid var(--border);
    border-radius:16px; padding:20px; margin-bottom:16px; display:none; flex-direction:column; gap:14px; }
  .settings-panel.show { display:flex; }
  .setting-row { display:flex; align-items:center; justify-content:space-between; }
  .setting-label { font-size:13px; color:var(--text-dim); }
  .setting-select,.setting-input { padding:6px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:13px; outline:none; font-family:inherit; }
  .setting-select { max-width:160px; appearance:none; -webkit-appearance:none; cursor:pointer; }
  .setting-input { width:60px; text-align:center; }

  .nav-tabs { display:flex; gap:4px; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:4px; margin-bottom:16px; }
  .nav-tab { flex:1; padding:10px 0; text-align:center; font-size:13px; font-weight:550;
    border-radius:12px; cursor:pointer; transition:all .2s; color:var(--text-dim);
    border:none; background:none; }
  .nav-tab.on { background:rgba(255,255,255,0.08); color:var(--text); }

  /* Study */
  .study-area { flex:1; display:flex; flex-direction:column; }
  .daily-progress { text-align:center; margin-bottom:8px; padding:6px; }
  .daily-progress .today-label { font-size:11px; color:var(--text-dim); }
  .daily-progress .today-num { font-size:24px; font-weight:700; color:var(--purple); }
  .daily-dots { display:flex; gap:4px; justify-content:center; margin-bottom:16px; flex-wrap:wrap; }
  .daily-dot { width:8px; height:8px; border-radius:50%; background:var(--border); transition:background .2s; }
  .daily-dot.done { background:var(--green); }
  .daily-dot.current { background:var(--purple); transform:scale(1.3); }

  .card-outer { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .card-wrapper { perspective:1000px; width:100%; }
  .card { width:100%; aspect-ratio:1/1.3; max-height:370px; position:relative;
    transform-style:preserve-3d; transition:transform .5s cubic-bezier(0.4,0,0.2,1);
    cursor:pointer; margin:0 auto; }
  .card.flipped { transform:rotateY(180deg); }
  .card-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:20px;
    border:1px solid var(--border); display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px 20px; text-align:center;
    background:var(--card-bg); box-shadow:0 20px 60px rgba(0,0,0,0.4),0 0 0 1px rgba(255,255,255,0.03) inset; }
  .card-back { transform:rotateY(180deg); }

  .card-pos { font-size:11px; padding:3px 10px; border-radius:10px; margin-bottom:10px;
    font-weight:600; letter-spacing:0.5px; }
  .card-pos.n { background:rgba(96,165,250,0.12); color:var(--blue); }
  .card-pos.v { background:rgba(239,68,68,0.12); color:var(--red); }
  .card-pos.adj { background:rgba(52,211,153,0.12); color:var(--green); }
  .card-pos.adv { background:rgba(167,139,250,0.12); color:var(--purple); }
  .card-pos.prep { background:rgba(245,158,11,0.12); color:var(--amber); }
  .card-pos.conj { background:rgba(244,114,182,0.12); color:var(--pink); }
  .card-pos.pron { background:rgba(96,165,250,0.12); color:var(--blue); }
  .card-pos.art { background:rgba(167,139,250,0.12); color:var(--purple); }
  .card-pos.int { background:rgba(245,158,11,0.12); color:var(--amber); }
  .card-pos { background:rgba(255,255,255,0.06); color:var(--text-dim); }

  .card-word { font-size:42px; font-weight:750; letter-spacing:-1px; margin-bottom:4px; line-height:1.1; }
  .card-phonetic-display { font-size:14px; color:var(--text-dim); margin-bottom:12px; font-style:italic; }
  .card-zh-main { font-size:28px; font-weight:700; margin-bottom:12px; }
  .card-example { font-size:14px; color:var(--text-dim); line-height:1.6; font-style:italic; max-width:280px; display:flex; align-items:flex-start; gap:6px; }
  .btn-voice-inline { width:28px; height:28px; border-radius:50%; border:1px solid var(--border);
    background:rgba(96,165,250,0.06); color:var(--blue); font-size:12px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:all .15s; vertical-align:middle; }
  .btn-voice-inline:hover { background:rgba(96,165,250,0.15); }
  .btn-voice-inline.speaking { background:rgba(96,165,250,0.2); border-color:var(--blue); animation:voicering .6s ease-in-out infinite; }
  .card-example-text { flex:1; }
  .btn-voice-card { width:48px; height:48px; border-radius:50%; border:1px solid var(--border);
    background:rgba(96,165,250,0.08); color:var(--blue); font-size:22px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s; margin:8px 0; }
  .btn-voice-card:hover { background:rgba(96,165,250,0.18); }
  .btn-voice-card.speaking { background:rgba(96,165,250,0.2); border-color:var(--blue);
    animation:voicering .6s ease-in-out infinite; }
  @keyframes voicering { 0%,100%{box-shadow:0 0 0 0 rgba(96,165,250,.3)} 50%{box-shadow:0 0 0 12px rgba(96,165,250,0)} }
  .card-hint-text { font-size:12px; color:var(--text-dim); opacity:.45; margin-top:8px; }
  .card-meta { font-size:11px; color:var(--text-dim); opacity:.4; margin-top:6px; }

  .action-row { display:flex; gap:10px; padding:16px 0 24px; }
  .action-btn { flex:1; padding:16px 0; border-radius:14px; font-size:15px; font-weight:650;
    cursor:pointer; border:none; transition:all .15s; letter-spacing:.5px; }
  .action-btn:active { transform:scale(.95); }
  .btn-dunno { background:rgba(239,68,68,0.10); color:var(--red); }
  .btn-dunno:hover { background:rgba(239,68,68,0.18); }
  .btn-vague { background:rgba(245,158,11,0.10); color:var(--amber); }
  .btn-vague:hover { background:rgba(245,158,11,0.18); }
  .btn-know { background:rgba(52,211,153,0.10); color:var(--green); }
  .btn-know:hover { background:rgba(52,211,153,0.18); }

  .done-state { text-align:center; padding:60px 20px; flex:1; display:flex;
    flex-direction:column; align-items:center; justify-content:center; }
  .done-state .emoji { font-size:56px; margin-bottom:12px; }
  .done-state h3 { font-size:20px; margin-bottom:6px; }
  .done-state p { font-size:13px; color:var(--text-dim); line-height:1.6; }
  .done-stats { display:flex; gap:16px; margin-top:20px; }
  .done-stat { text-align:center; }
  .done-stat .n { font-size:28px; font-weight:700; }
  .done-stat .l { font-size:11px; color:var(--text-dim); margin-top:2px; }

  /* Word list */
  .list-area { display:none; flex:1; flex-direction:column; }
  .list-area.show { display:flex; }
  .list-toolbar { display:flex; gap:8px; margin-bottom:10px; }
  .search-box { flex:1; padding:10px 14px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; color:var(--text); font-size:14px; outline:none; font-family:inherit; }
  .search-box::placeholder { color:var(--text-dim); opacity:.5; }
  .search-box:focus { border-color:var(--purple); }
  .pos-filter { padding:8px 12px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim); font-size:13px; cursor:pointer;
    appearance:none; -webkit-appearance:none; outline:none; max-width:90px; }
  .pos-filter:focus { border-color:var(--purple); }

  .word-scroll { flex:1; overflow-y:auto; }
  .pos-section-title { font-size:12px; font-weight:600; color:var(--text-dim); padding:8px 4px 4px;
    text-transform:uppercase; letter-spacing:.5px; }
  .word-item { display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; background:var(--surface); border:1px solid var(--border);
    border-radius:11px; margin-bottom:5px; }
  .word-item .en { font-size:15px; font-weight:600; }
  .word-item .en .ph { font-size:11px; color:var(--text-dim); margin-left:6px; font-weight:400; font-style:italic; }
  .word-item .zh { font-size:12px; color:var(--text-dim); margin-top:2px; }
  .word-item .ex { font-size:11px; color:var(--text-dim); opacity:.6; margin-top:1px; font-style:italic; }
  .word-item .meta { display:flex; gap:6px; align-items:center; }
  .word-tag { font-size:10px; padding:3px 10px; border-radius:10px; font-weight:600; }
  .word-tag.l0{background:rgba(239,68,68,.10);color:var(--red)}
  .word-tag.l1{background:rgba(245,158,11,.10);color:var(--amber)}
  .word-tag.l2{background:rgba(96,165,250,.10);color:var(--blue)}
  .word-tag.l3{background:rgba(167,139,250,.10);color:var(--purple)}
  .word-tag.l4{background:rgba(52,211,153,.10);color:var(--green)}
  .word-del-btn { width:26px; height:26px; border-radius:8px; border:1px solid var(--border);
    background:none; color:var(--text-dim); cursor:pointer; font-size:12px;
    display:flex; align-items:center; justify-content:center; }
  .word-del-btn:hover { background:rgba(239,68,68,.15); color:var(--red); }

  /* Add */
  .add-area { display:none; flex:1; flex-direction:column; }
  .add-area.show { display:flex; }
  .add-field { margin-bottom:12px; }
  .add-field label { font-size:12px; color:var(--text-dim); display:block; margin-bottom:4px; }
  .add-field input,.add-field textarea { width:100%; padding:12px 14px; background:var(--surface);
    border:1px solid var(--border); border-radius:12px; color:var(--text); font-size:14px;
    outline:none; font-family:inherit; }
  .add-field textarea { resize:vertical; min-height:50px; }
  .add-field input:focus,.add-field textarea:focus { border-color:var(--purple); }
  .add-row { display:flex; gap:8px; }
  .add-row .add-field { flex:1; }
  .add-submit { width:100%; padding:14px; border-radius:14px;
    background:linear-gradient(135deg,#a78bfa,#60a5fa);
    color:#fff; border:none; font-size:15px; font-weight:650; cursor:pointer;
    letter-spacing:.3px; margin-top:4px; }
  .add-submit:hover { opacity:.9; }
  .add-reset { width:100%; padding:12px; margin-top:8px; border-radius:14px;
    background:none; border:1px solid var(--border); color:var(--text-dim);
    font-size:12px; cursor:pointer; }
  .add-reset:hover { background:rgba(239,68,68,.06); color:var(--red); }

  @media(max-width:380px){ .card-word{font-size:34px} .card-zh-main{font-size:24px} .action-btn{font-size:14px;padding:14px 0} }
</style>
</head>

<div class="app">
  <div class="top-bar">
    <h1>📚 WordVault</h1>
    <div class="top-settings"><button class="top-btn" onclick="toggleSettings()" title="设置">⚙️</button></div>
  </div>
  <div class="settings-panel" id="settings">
    <div class="setting-row"><span class="setting-label">🎤 朗读声音</span><select class="setting-select" id="so-voice" onchange="onVoiceChange(this.value)"></select></div>
    <div class="setting-row"><span class="setting-label">🎵 朗读语速</span><select class="setting-select" id="so-rate" onchange="onRateChange(this.value)"><option value="0.7">慢</option><option value="0.85">稍慢</option><option value="1.0">正常</option><option value="1.15">稍快</option><option value="1.3">快</option></select></div>
    <div class="setting-row"><span class="setting-label">📅 每日词数</span><input class="setting-input" type="number" min="5" max="200" id="so-daily" onchange="onDailyChange(this.value)"></div>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab on" onclick="switchTab('study')">📝 学习</button>
    <button class="nav-tab" onclick="switchTab('words')">📖 词库</button>
    <button class="nav-tab" onclick="switchTab('add')">➕ 添加</button>
  </div>
  <div class="study-area" id="study-area"><div id="study"></div></div>
  <div class="list-area" id="list-area">
    <div class="list-toolbar">
      <input class="search-box" placeholder="🔍 搜索单词..." oninput="renderList()" id="sq">
      <select class="pos-filter" id="pf" onchange="renderList()">
        <option value="all">全部词性</option>
        <option value="n">名词</option>
        <option value="v">动词</option>
        <option value="adj">形容词</option>
        <option value="adv">副词</option>
        <option value="prep">介词</option>
        <option value="conj">连词</option>
        <option value="pron">代词</option>
        <option value="art">冠词</option>
        <option value="int">感叹词</option>
      </select>
    </div>
    <div class="word-scroll" id="list"></div>
  </div>
  <div class="add-area" id="add-area">
    <div class="add-field"><label>英文单词 *</label><input placeholder="serendipity" id="ae"></div>
    <div class="add-field"><label>中文释义 *</label><input placeholder="意外发现的美好" id="az"></div>
    <div class="add-row">
      <div class="add-field"><label>音标</label><input placeholder="/ˌserənˈdɪpəti/" id="ap"></div>
      <div class="add-field"><label>词性</label><input placeholder="n. / v. / adj. ..." id="apos" value="n." style="max-width:100px;"></div>
    </div>
    <div class="add-field"><label>例句</label><textarea placeholder="It was pure serendipity." id="ax"></textarea></div>
    <button class="add-submit" onclick="addWord()">添加单词</button>
    <button class="add-reset" onclick="resetAll()">🔄 重置全部数据</button>
  </div>
</div>

const POS_LABELS={n:'名词',v:'动词',adj:'形容词',adv:'副词',prep:'介词',conj:'连词',pron:'代词',art:'冠词','int':'感叹词'};

function load(){let w=ls('wv3_words');if(!w){w=JSON.parse(JSON.stringify(EMBEDDED));ls('wv3_words',w)}return w}
function save(w){ls('wv3_words',w)}
function streak(){var d=ls('wv3_streak')||{d:'',n:0};var t=dateKey();if(d.d===t)return d.n;var y=dateKey(-1);var n=d.d===y?d.n+1:1;ls('wv3_streak',{d:t,n});return n}
function dateKey(off){var d=new Date();if(off)d.setDate(d.getDate()+off);return d.toISOString().slice(0,10)}
function due(w){return w.filter(function(x){return x.nextReview<=Date.now()})}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function todayKey(){return 'wv3_today_'+dateKey()}
function getTodayReviewed(){return ls(todayKey())||[]}
function markToday(wordEn){var r=getTodayReviewed();if(r.indexOf(wordEn)===-1){r.push(wordEn);ls(todayKey(),r)}}
function todayCount(){return getTodayReviewed().length}

var selectedVoice=ls('wv3_voice')||'';
var dailyLimit=ls('wv3_daily')||30;
var ttsRate=ls('wv3_rate')||1.0;

function saveVoice(v){selectedVoice=v;ls('wv3_voice',v)}
function saveDaily(n){n=parseInt(n)||30;n=Math.max(5,Math.min(200,n));dailyLimit=n;ls('wv3_daily',n);renderStudy()}
function saveRate(r){ttsRate=parseFloat(r)||1.0;ls('wv3_rate',ttsRate);renderStudy()}

var cachedVoices=[];
function loadVoices(){
  cachedVoices=window.speechSynthesis.getVoices().filter(function(v){return v.lang.indexOf('en')===0});
  if(cachedVoices.length===0){cachedVoices=window.speechSynthesis.getVoices().filter(function(v){return v.lang.indexOf('en')===0})}
  return cachedVoices;
}
function populateVoices(){
  var sel=document.getElementById('so-voice');if(!sel)return;
  var voices=loadVoices();if(voices.length===0){setTimeout(populateVoices,200);return}
  voices.sort(function(a,b){
    var aq=a.name.indexOf('Samantha')>=0||a.name.indexOf('Karen')>=0||a.name.indexOf('Daniel')>=0||a.name.indexOf('Moira')>=0||a.name.indexOf('Tessa')>=0;
    var bq=b.name.indexOf('Samantha')>=0||b.name.indexOf('Karen')>=0||b.name.indexOf('Daniel')>=0||b.name.indexOf('Moira')>=0||b.name.indexOf('Tessa')>=0;
    if(aq&&!bq)return -1;if(!aq&&bq)return 1;return a.name.localeCompare(b.name);
  });
  sel.innerHTML=voices.map(function(v){var s=selectedVoice===v.name?' selected':'';return '<option value="'+v.name+'"'+s+'>'+v.name+'</option>'}).join('');
  if(!selectedVoice&&voices.length>0){var b=voices.filter(function(v){return v.name.indexOf('Samantha')>=0});selectedVoice=b.length?b[0].name:voices[0].name;saveVoice(selectedVoice)}
}

function speak(word,ev){
  if(ev){ev.stopPropagation();ev.preventDefault();}
  if(!window.speechSynthesis)return;window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=ttsRate;u.pitch=1.0;
  var voices=cachedVoices.length>0?cachedVoices:loadVoices();
  var vv=voices.filter(function(v){return v.name===selectedVoice});if(vv.length)u.voice=vv[0];
  var btn=document.getElementById('vc');if(btn)btn.classList.add('speaking');
  u.onend=u.onerror=function(){if(btn)btn.classList.remove('speaking')};window.speechSynthesis.speak(u);
}
function speakSentence(btn,ev){
  if(ev){ev.stopPropagation();ev.preventDefault();}
  var text=btn.getAttribute('data-text');if(!text||!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=ttsRate;u.pitch=1.0;
  var voices=cachedVoices.length>0?cachedVoices:loadVoices();
  var vv=voices.filter(function(v){return v.name===selectedVoice});if(vv.length)u.voice=vv[0];
  btn.classList.add('speaking');
  u.onend=u.onerror=function(){btn.classList.remove('speaking')};window.speechSynthesis.speak(u);
}

// Study
var cur=null;
function getPosClass(pos){if(!pos)return'';var p=pos.replace('.','');return ['n','v','adj','adv','prep','conj','pron','art','int'].indexOf(p)>=0?p:'';}

function renderStudy(){
  var w=load();var d=due(w);var td=getTodayReviewed();
  d=d.filter(function(x){return td.indexOf(x.en)===-1});
  if(d.length===0){
    var m=w.filter(function(x){return x.level===4}).length;
    var t=todayCount();
    document.getElementById('study').innerHTML='<div class="done-state"><div class="emoji">🎉</div><h3>今日学习完成！</h3><p>今天已学 '+t+' 个词</p><div class="done-stats"><div class="done-stat"><div class="n" style="color:var(--green)">'+m+'</div><div class="l">已掌握</div></div><div class="done-stat"><div class="n" style="color:var(--purple)">'+streak()+'</div><div class="l">连续天</div></div><div class="done-stat"><div class="n" style="color:var(--blue)">'+w.length+'</div><div class="l">总词汇</div></div></div></div>';
    return;
  }
  shuffle(d);var pool=d.slice(0,dailyLimit);cur=pool[0];
  var tdone=todayCount();var totalPool=pool.length;
  var dots='';for(var i=0;i<totalPool;i++){var cls='daily-dot';if(i<tdone)cls+=' done';if(i===tdone)cls+=' current';dots+='<div class="'+cls+'"></div>';}
  var pc=getPosClass(cur.pos);

  var el=document.getElementById('study');
  el.innerHTML='<div class="daily-progress"><div class="today-label">今日目标</div><div class="today-num">'+(tdone+1)+' / '+totalPool+'</div></div><div class="daily-dots">'+dots+'</div><div class="card-outer"><div class="card-wrapper"><div class="card" id="fc" onclick="flipCard()"><div class="card-face card-front"><span class="card-pos '+pc+'">'+(cur.pos||'')+'</span><div class="card-word">'+cur.en+'</div><div class="card-phonetic-display">'+(cur.phonetic||'')+'</div><button class="btn-voice-card" id="vc" onclick="speak(\''+cur.en.replace(/'/g,"\\'")+'\',event)">🔊</button><div class="card-hint-text">点击卡片查看释义</div></div><div class="card-face card-back"><div class="card-zh-main">'+cur.zh+'</div>'+(cur.example?'<div class="card-example"><span class="card-example-text">'+cur.example.replace(/"/g,'&quot;')+'</span><button class="btn-voice-inline" data-text="'+cur.example.replace(/"/g,'&quot;')+'" onclick="speakSentence(this,event)">🔊</button></div>':'')+'<div class="card-meta">复习 '+cur.timesReviewed+' 次 · '+LVL[cur.level]+'</div></div></div></div></div><div class="action-row"><button class="action-btn btn-dunno" onclick="answer(0)">不认识</button><button class="action-btn btn-vague" onclick="answer(1)">模糊</button><button class="action-btn btn-know" onclick="answer(2)">认识</button></div>';
}

function flipCard(){var c=document.getElementById('fc');if(c)c.classList.toggle('flipped');}

function answer(type){
  if(!cur)return;var w=load();var wi=w.find(function(x){return x.en===cur.en});if(!wi)return;
  if(type===0)wi.level=0;else if(type===1){} else wi.level=Math.min(4,wi.level+1);
  wi.timesReviewed++;if(type===1)wi.nextReview=Date.now()+864e5;else wi.nextReview=Date.now()+SPACED[wi.level]*864e5;
  markToday(wi.en);save(w);cur=null;renderStudy();
}

// Word list with POS filtering
function renderList(){
  var w=load();var q=(document.getElementById('sq')||{}).value||'';q=q.toLowerCase();
  var pf=(document.getElementById('pf')||{}).value||'all';
  var f=q?w.filter(function(x){return x.en.toLowerCase().indexOf(q)>-1||x.zh.indexOf(q)>-1}):w;
  if(pf!=='all'){f=f.filter(function(x){return (x.pos||'').replace('.','')===pf});}

  // Group by POS
  var groups={};f.forEach(function(x,i){var p=x.pos||'?';var key=p.replace('.','');if(!groups[key])groups[key]=[];groups[key].push({w:x,idx:w.indexOf(x)});});

  var POS_ORDER=['n','v','adj','adv','prep','conj','pron','art','int'];
  var html='';
  POS_ORDER.forEach(function(p){
    if(!groups[p]||groups[p].length===0)return;
    html+='<div class="pos-section-title">'+POS_LABELS[p]+' ('+groups[p].length+')</div>';
    groups[p].forEach(function(item){
      var x=item.w,i=item.idx;
      html+='<div class="word-item"><div><div class="en">'+x.en+'<span class="ph">'+(x.phonetic||'')+'</span></div><div class="zh">'+x.zh+'</div>'+(x.example?'<div class="ex">'+x.example+'</div>':'')+'</div><div class="meta"><span class="word-tag l'+x.level+'">'+LVL[x.level]+'</span><button class="word-del-btn" onclick="delWord('+i+')">✕</button></div></div>';
    });
  });
  // Remaining
  var rest=[];for(var k in groups){if(POS_ORDER.indexOf(k)<0)rest=rest.concat(groups[k]);}
  if(rest.length>0){
    html+='<div class="pos-section-title">其他 ('+rest.length+')</div>';
    rest.forEach(function(item){var x=item.w,i=item.idx;
      html+='<div class="word-item"><div><div class="en">'+x.en+'<span class="ph">'+(x.phonetic||'')+'</span></div><div class="zh">'+x.zh+'</div>'+(x.example?'<div class="ex">'+x.example+'</div>':'')+'</div><div class="meta"><span class="word-tag l'+x.level+'">'+LVL[x.level]+'</span><button class="word-del-btn" onclick="delWord('+i+')">✕</button></div></div>';
    });
  }
  if(!html)html='<div class="done-state"><div class="emoji">📭</div><h3>没有匹配的单词</h3></div>';
  document.getElementById('list').innerHTML=html;
}

function delWord(i){if(!confirm('删除？'))return;var w=load();if(cur&&w[i]&&w[i].en===cur.en)cur=null;w.splice(i,1);save(w);renderList();renderStudy();}

function addWord(){
  var en=document.getElementById('ae').value.trim();var zh=document.getElementById('az').value.trim();
  if(!en||!zh){alert('英文和中文必填');return}
  var w=load();if(w.some(function(x){return x.en.toLowerCase()===en.toLowerCase()})){alert('已存在');return}
  var pos=document.getElementById('apos').value.trim()||'n.';
  w.push({en:en,zh:zh,example:document.getElementById('ax').value.trim(),phonetic:document.getElementById('ap').value.trim(),pos:pos,level:0,nextReview:0,timesReviewed:0});
  save(w);['ae','az','ax','ap','apos'].forEach(function(id){document.getElementById(id).value=''});document.getElementById('ae').focus();renderStudy();renderList();
}

function resetAll(){
  if(!confirm('重置全部？不可撤销！'))return;
  var keys=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf('wv3_')===0)keys.push(k)}
  keys.forEach(function(k){localStorage.removeItem(k)});cur=null;renderStudy();renderList();
}

var currentTab='study';
function switchTab(name){
  currentTab=name;
  document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('on')});
  var map={study:0,words:1,add:2};document.querySelectorAll('.nav-tab')[map[name]].classList.add('on');
  document.getElementById('study').parentElement.style.display=name==='study'?'flex':'none';
  document.getElementById('list-area').classList.toggle('show',name==='words');
  document.getElementById('add-area').classList.toggle('show',name==='add');
  if(name==='words')renderList();if(name==='study')renderStudy();
}

function toggleSettings(){
  document.getElementById('settings').classList.toggle('show');
  if(document.getElementById('settings').classList.contains('show')){
    setTimeout(populateVoices,100);document.getElementById('so-voice').value=selectedVoice;
    document.getElementById('so-daily').value=dailyLimit;document.getElementById('so-rate').value=ttsRate;
  }
}
function onVoiceChange(v){saveVoice(v);}
function onDailyChange(v){saveDaily(v);}
function onRateChange(v){saveRate(v);}

function init(){
  if(window.speechSynthesis){
    window.speechSynthesis.onvoiceschanged=function(){
      loadVoices();
      if(!selectedVoice&&cachedVoices.length>0){var b=cachedVoices.filter(function(v){return v.name.indexOf('Samantha')>=0});selectedVoice=b.length?b[0].name:cachedVoices[0].name;saveVoice(selectedVoice);}
      if(currentTab==='study')renderStudy();if(document.getElementById('settings').classList.contains('show'))populateVoices();
    };
    window.speechSynthesis.getVoices();
    setTimeout(function(){loadVoices();if(!selectedVoice&&cachedVoices.length>0){var b=cachedVoices.filter(function(v){return v.name.indexOf('Samantha')>=0});selectedVoice=b.length?b[0].name:cachedVoices[0].name;saveVoice(selectedVoice);}},500);
  }
  renderStudy();
}
streak();init();
</script>
