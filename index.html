<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>霹雳王 · 科学记单词</title>
<style>
  :root {
    --bg: #0d0d1a; --surface: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.06);
    --text: #e8e8f0; --text-dim: #7a7a96; --green: #34d399; --amber: #f59e0b;
    --red: #ef4444; --blue: #60a5fa; --purple: #a78bfa; --pink: #f472b6;
    --card-bg: #15152a; --orange: #fb923c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    background: var(--bg); background-image:
      radial-gradient(ellipse at 50% 0%, rgba(139,92,246,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(59,130,246,0.06) 0%, transparent 60%);
    color: var(--text); min-height: 100vh; display: flex; justify-content: center;
    padding: 12px; -webkit-tap-highlight-color: transparent; user-select: none; }
  .app { width:100%; max-width:440px; display:flex; flex-direction:column; min-height:100vh; }

  .top-bar { display:flex; align-items:center; justify-content:space-between; padding:20px 0 8px; }
  .top-bar h1 { font-size:21px; font-weight:700; letter-spacing:-0.4px;
    background:linear-gradient(135deg,#a78bfa,#60a5fa); -webkit-background-clip:text;
    -webkit-text-fill-color:transparent; background-clip:text; }
  .top-btn { width:32px; height:32px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim); font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .top-btn:hover { background:rgba(255,255,255,0.08); color:var(--text); }

  .settings-panel { background:rgba(20,20,40,0.95); border:1px solid var(--border);
    border-radius:16px; padding:18px; margin-bottom:12px; display:none; flex-direction:column; gap:12px; }
  .settings-panel.show { display:flex; }
  .setting-row { display:flex; align-items:center; justify-content:space-between; }
  .setting-label { font-size:12px; color:var(--text-dim); }
  .setting-select,.setting-input { padding:5px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:12px; outline:none; font-family:inherit; }
  .setting-select { max-width:150px; appearance:none; -webkit-appearance:none; cursor:pointer; }
  .setting-input { width:56px; text-align:center; }

  .nav-tabs { display:flex; gap:3px; background:var(--surface); border:1px solid var(--border);
    border-radius:13px; padding:3px; margin-bottom:14px; }
  .nav-tab { flex:1; padding:9px 0; text-align:center; font-size:12px; font-weight:550;
    border-radius:11px; cursor:pointer; transition:all .2s; color:var(--text-dim);
    border:none; background:none; white-space:nowrap; }
  .nav-tab.on { background:rgba(255,255,255,0.08); color:var(--text); }

  /* Panel */
  .pane { display:none; flex:1; flex-direction:column; }
  .pane.on { display:flex; }

  /* Card */
  .card-scene { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .card-wrap { perspective:1000px; width:100%; }
  .card { width:100%; aspect-ratio:1/1.35; max-height:360px; position:relative;
    transform-style:preserve-3d; transition:transform .5s cubic-bezier(0.4,0,0.2,1); cursor:pointer; margin:0 auto; }
  .card.flipped { transform:rotateY(180deg); }
  .card-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:18px;
    border:1px solid var(--border); display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:20px 18px; text-align:center;
    background:var(--card-bg); box-shadow:0 16px 48px rgba(0,0,0,0.4),0 0 0 1px rgba(255,255,255,0.03) inset; }
  .card-back { transform:rotateY(180deg); }

  .card-pos { font-size:10px; padding:2px 10px; border-radius:8px; margin-bottom:8px; font-weight:600; }
  .card-pos.n{background:rgba(96,165,250,.12);color:var(--blue)}
  .card-pos.v{background:rgba(239,68,68,.12);color:var(--red)}
  .card-pos.adj{background:rgba(52,211,153,.12);color:var(--green)}
  .card-pos.adv{background:rgba(167,139,250,.12);color:var(--purple)}
  .card-pos.prep{background:rgba(245,158,11,.12);color:var(--amber)}
  .card-pos.other{background:rgba(255,255,255,.06);color:var(--text-dim)}

  .card-word { font-size:40px; font-weight:750; letter-spacing:-1px; margin-bottom:2px; }
  .card-phonetic { font-size:13px; color:var(--text-dim); margin-bottom:10px; font-style:italic; }
  .card-zh-main { font-size:26px; font-weight:700; margin-bottom:6px; }
  .card-ex-block { margin-bottom:8px; max-width:300px; }
  .card-ex-en { font-size:13px; color:var(--text-dim); line-height:1.5; font-style:italic; }
  .card-ex-zh { font-size:12px; color:var(--text-dim); opacity:.65; margin-top:2px; }
  .card-meta { font-size:10px; color:var(--text-dim); opacity:.4; }

  .btn-voice { width:42px; height:42px; border-radius:50%; border:1px solid var(--border);
    background:rgba(96,165,250,0.06); color:var(--blue); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s; margin:6px 0; }
  .btn-voice:hover { background:rgba(96,165,250,0.15); }
  .btn-voice.speaking { background:rgba(96,165,250,0.2); border-color:var(--blue);
    animation:voicering .6s ease-in-out infinite; }
  @keyframes voicering { 0%,100%{box-shadow:0 0 0 0 rgba(96,165,250,.3)} 50%{box-shadow:0 0 0 10px rgba(96,165,250,0)} }
  .card-hint { font-size:11px; color:var(--text-dim); opacity:.4; margin-top:8px; }
  .spell-area { width:100%; max-width:260px; margin-top:10px; }
  .spell-input { width:100%; padding:10px 14px; background:rgba(255,255,255,0.05); border:2px solid var(--border);
    border-radius:10px; color:var(--text); font-size:18px; text-align:center; outline:none;
    font-family:inherit; letter-spacing:1px; transition:border-color .2s; }
  .spell-input:focus { border-color:var(--purple); }
  .spell-input.correct { border-color:var(--green); background:rgba(52,211,153,0.08); }
  .spell-input.wrong { border-color:var(--red); background:rgba(239,68,68,0.08); animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .spell-feedback { font-size:12px; margin-top:6px; min-height:18px; }
  .spell-feedback.ok { color:var(--green); }
  .spell-feedback.err { color:var(--red); }
  .spell-feedback.show { color:var(--amber); }
  .spell-btn { margin-top:8px; padding:8px 24px; border-radius:10px; border:none;
    background:var(--purple); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  .spell-btn:active { opacity:.8; }
  .spell-retry { font-size:11px; color:var(--text-dim); margin-top:4px; }

  .btn-voice-sm { width:26px; height:26px; border-radius:50%; border:1px solid var(--border);
    background:rgba(96,165,250,0.04); color:var(--blue); font-size:11px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:all .15s; vertical-align:middle; margin-left:4px; }
  .btn-voice-sm:hover { background:rgba(96,165,250,0.12); }
  .btn-voice-sm.speaking { background:rgba(96,165,250,0.18); border-color:var(--blue); }

  /* Progress */
  .progress { text-align:center; margin-bottom:6px; }
  .progress .n { font-size:20px; font-weight:700; color:var(--purple); }
  .progress .l { font-size:10px; color:var(--text-dim); }
  .dots { display:flex; gap:3px; justify-content:center; margin-bottom:12px; flex-wrap:wrap; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--border); transition:background .2s; }
  .dot.done { background:var(--green); }
  .dot.cur { background:var(--purple); transform:scale(1.3); }

  /* Review progress */
  .review-progress { margin-bottom:8px; }
  .review-bar { height:3px; background:var(--surface); border-radius:3px; margin-bottom:4px; overflow:hidden; }
  .review-fill { height:100%; background:linear-gradient(90deg,var(--red),var(--amber),var(--green)); border-radius:3px; transition:width .3s; }
  .review-stats { display:flex; justify-content:space-between; font-size:10px; color:var(--text-dim); }

  /* Action buttons */
  .actions { display:flex; gap:8px; padding:14px 0 20px; }
  .act { flex:1; padding:15px 0; border-radius:13px; font-size:14px; font-weight:650;
    cursor:pointer; border:none; transition:all .12s; letter-spacing:.3px; }
  .act:active { transform:scale(.95); }
  .act-no { background:rgba(239,68,68,0.09); color:var(--red); }
  .act-no:hover { background:rgba(239,68,68,0.16); }
  .act-maybe { background:rgba(245,158,11,0.09); color:var(--amber); }
  .act-maybe:hover { background:rgba(245,158,11,0.16); }
  .act-yes { background:rgba(52,211,153,0.09); color:var(--green); }
  .act-yes:hover { background:rgba(52,211,153,0.16); }
  .act-learn { width:100%; background:rgba(52,211,153,0.12); color:var(--green); }
  .act-learn:hover { background:rgba(52,211,153,0.2); }

  .done-state { text-align:center; padding:50px 20px; flex:1; display:flex;
    flex-direction:column; align-items:center; justify-content:center; }
  .done-state .emoji { font-size:48px; margin-bottom:10px; }
  .done-state h3 { font-size:18px; margin-bottom:4px; }
  .done-state p { font-size:12px; color:var(--text-dim); line-height:1.5; }
  .done-stats { display:flex; gap:14px; margin-top:16px; }
  .done-stat { text-align:center; }
  .done-stat .n { font-size:24px; font-weight:700; }
  .done-stat .l { font-size:10px; color:var(--text-dim); margin-top:1px; }

  /* Word list */
  .list-toolbar { display:flex; gap:6px; margin-bottom:8px; }
  .search-box { flex:1; padding:10px 12px; background:var(--surface); border:1px solid var(--border);
    border-radius:11px; color:var(--text); font-size:13px; outline:none; font-family:inherit; }
  .search-box::placeholder { color:var(--text-dim); opacity:.5; }
  .search-box:focus { border-color:var(--purple); }
  .pos-filter { padding:8px 10px; border-radius:11px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim); font-size:12px; cursor:pointer;
    appearance:none; -webkit-appearance:none; outline:none; }
  .word-scroll { flex:1; overflow-y:auto; }
  .pager { display:flex; align-items:center; justify-content:center; gap:10px; padding:10px 0 4px; }
  .pager-btn { padding:6px 16px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:12px; cursor:pointer; transition:all .15s; }
  .pager-btn:hover { background:var(--surface-hover); color:var(--text); }
  .pager-btn:disabled { opacity:.3; cursor:default; }
  .pager-info { font-size:11px; color:var(--text-dim); }
  .pos-title { font-size:11px; font-weight:600; color:var(--text-dim); padding:6px 4px 3px;
    letter-spacing:.5px; }
  .word-item { display:flex; align-items:flex-start; justify-content:space-between;
    padding:10px 12px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; margin-bottom:4px; }
  .word-item .en { font-size:14px; font-weight:600; }
  .word-item .ph { font-size:10px; color:var(--text-dim); margin-left:5px; font-weight:400; font-style:italic; }
  .word-item .zh { font-size:11px; color:var(--text-dim); margin-top:1px; }
  .word-item .ex-line { font-size:10px; color:var(--text-dim); opacity:.5; margin-top:1px; }
  .word-item .meta { display:flex; gap:4px; align-items:center; flex-shrink:0; }
  .word-tag { font-size:9px; padding:2px 8px; border-radius:8px; font-weight:600; white-space:nowrap; }
  .word-tag.l0{background:rgba(239,68,68,.09);color:var(--red)}
  .word-tag.l1{background:rgba(245,158,11,.09);color:var(--amber)}
  .word-tag.l2{background:rgba(96,165,250,.09);color:var(--blue)}
  .word-tag.l3{background:rgba(167,139,250,.09);color:var(--purple)}
  .word-tag.l4{background:rgba(52,211,153,.09);color:var(--green)}
  .word-del { width:24px; height:24px; border-radius:7px; border:1px solid var(--border);
    background:none; color:var(--text-dim); cursor:pointer; font-size:11px;
    display:flex; align-items:center; justify-content:center; }
  .word-del:hover { background:rgba(239,68,68,.12); color:var(--red); }

  /* Add */
  .add-field { margin-bottom:10px; }
  .add-field label { font-size:11px; color:var(--text-dim); display:block; margin-bottom:3px; }
  .add-field input,.add-field textarea { width:100%; padding:10px 12px; background:var(--surface);
    border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:13px;
    outline:none; font-family:inherit; }
  .add-field textarea { resize:vertical; min-height:45px; }
  .add-row { display:flex; gap:6px; }
  .add-row .add-field { flex:1; }
  .btn-submit { width:100%; padding:13px; border-radius:13px;
    background:linear-gradient(135deg,#a78bfa,#60a5fa); color:#fff; border:none;
    font-size:14px; font-weight:650; cursor:pointer; letter-spacing:.3px; margin-top:2px; }
  .btn-submit:hover { opacity:.9; }
  .btn-reset { width:100%; padding:11px; margin-top:6px; border-radius:13px;
    background:none; border:1px solid var(--border); color:var(--text-dim);
    font-size:11px; cursor:pointer; }
  .btn-reset:hover { background:rgba(239,68,68,.05); color:var(--red); }

  @media(max-width:360px){ .card-word{font-size:32px} .card-zh-main{font-size:22px} .act{font-size:13px;padding:13px 0} }
</style>
</head>

<div class="app">
  <div class="top-bar"><h1>⚡ 霹雳王</h1><button class="top-btn" onclick="toggleSettings()">⚙️</button></div>
  <div class="settings-panel" id="settings">
    <div class="setting-row"><span class="setting-label">🎤 朗读声音</span><select class="setting-select" id="so-voice" onchange="onVoiceChange(this.value)"></select></div>
    <div class="setting-row"><span class="setting-label">🎵 朗读语速</span><select class="setting-select" id="so-rate" onchange="onRateChange(this.value)"><option value="0.7">慢</option><option value="0.85">稍慢</option><option value="1.0" selected>正常</option><option value="1.15">稍快</option><option value="1.3">快</option></select></div>
    <div class="setting-row"><span class="setting-label">📅 每日新词</span><input class="setting-input" type="number" min="5" max="100" id="so-learn" onchange="onLearnChange(this.value)"></div>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab on" onclick="switchTab('learn')">📝 学习</button>
    <button class="nav-tab" onclick="switchTab('review')">🔄 复习</button>
    <button class="nav-tab" onclick="switchTab('words')">📖 词库</button>
    <button class="nav-tab" onclick="switchTab('add')">➕ 添加</button>
  </div>
  <div class="pane on" id="pane-learn"><div id="learn"></div></div>
  <div class="pane" id="pane-review"><div id="review"></div></div>
  <div class="pane" id="pane-words">
    <div class="list-toolbar"><input class="search-box" placeholder="🔍 搜索英文或中文..." oninput="renderList(true)" id="sq"><select class="pos-filter" id="pf" onchange="renderList(true)"><option value="all">全部</option><option value="int">感叹词</option><option value="art">冠词</option><option value="pron">代词</option><option value="conj">连词</option><option value="prep">介词</option><option value="adv">副词</option><option value="v">动词</option><option value="adj">形容词</option><option value="n">名词</option></select></div>
    <div class="word-scroll" id="list"></div>
    <div class="pager" id="pager">
      <button class="pager-btn" onclick="prevPage()">◀</button>
      <span class="pager-info" id="page-info"></span>
      <button class="pager-btn" onclick="nextPage()">▶</button>
      <span class="pager-info" style="margin-left:6px;">跳至</span>
      <input class="setting-input" type="number" min="1" id="jump-page" style="width:44px;font-size:11px;padding:4px 6px;" onkeydown="if(event.key==='Enter')jumpPage()">
      <button class="pager-btn" onclick="jumpPage()" style="padding:4px 10px;font-size:11px;">GO</button>
    </div>
  </div>
  <div class="pane" id="pane-add">
    <div class="add-field"><label>英文单词 *</label><input placeholder="serendipity" id="ae"></div>
    <div class="add-field"><label>中文释义 *</label><input placeholder="意外发现的美好" id="az"></div>
    <div class="add-row"><div class="add-field"><label>音标</label><input placeholder="/sɛrənˈdɪpəti/" id="ap"></div><div class="add-field"><label>词性</label><input placeholder="n." id="apos" value="n."></div></div>
    <div class="add-field"><label>例句（英文）</label><textarea placeholder="It was pure serendipity." id="ax"></textarea></div>
    <div class="add-field"><label>例句（中文）</label><textarea placeholder="这纯粹是意外之喜。" id="axz"></textarea></div>
    <button class="btn-submit" onclick="addWord()">添加单词</button>
    <button class="btn-reset" onclick="resetAll()">🔄 重置全部数据</button>
  </div>
</div>

function load(){let w=ls('wv4_words');if(!w){w=JSON.parse(JSON.stringify(EMBEDDED));ls('wv4_words',w)}return w}
function save(w){ls('wv4_words',w)}
function streak(){var d=ls('wv4_streak')||{d:'',n:0};var t=dateKey();if(d.d===t)return d.n;var y=dateKey(-1);var n=d.d===y?d.n+1:1;ls('wv4_streak',{d:t,n});return n}
function dateKey(off){var d=new Date();if(off)d.setDate(d.getDate()+off);return d.toISOString().slice(0,10)}
function due(w){return w.filter(function(x){return x.nextReview<=Date.now()})}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

// Daily tracking
function todayKey(){return 'wv4_today_'+dateKey()}
function getTodayReviewed(){return ls(todayKey())||[]}
function markToday(wordEn){var r=getTodayReviewed();if(r.indexOf(wordEn)===-1){r.push(wordEn);ls(todayKey(),r)}}
function todayCount(){return getTodayReviewed().length}

// Voice
var selectedVoice=ls('wv4_voice')||'';
var learnDaily=ls('wv4_learn')||20;
var ttsRate=ls('wv4_rate')||1.0;
function saveVoice(v){selectedVoice=v;ls('wv4_voice',v)}
function saveLearn(n){n=parseInt(n)||20;n=Math.max(5,Math.min(200,n));learnDaily=n;ls('wv4_learn',n);renderLearn()}
function saveRate(r){ttsRate=parseFloat(r)||1.0;ls('wv4_rate',ttsRate)}

var cachedVoices=[];
function loadVoices(){
  cachedVoices=window.speechSynthesis.getVoices().filter(function(v){return v.lang.indexOf('en')===0});
  if(cachedVoices.length===0)setTimeout(function(){cachedVoices=window.speechSynthesis.getVoices().filter(function(v){return v.lang.indexOf('en')===0})},100);
  return cachedVoices;
}
function populateVoices(){
  var sel=document.getElementById('so-voice');if(!sel)return;
  var voices=loadVoices();if(voices.length===0){setTimeout(populateVoices,200);return}
  voices.sort(function(a,b){
    var aq=a.name.indexOf('Samantha')>=0||a.name.indexOf('Karen')>=0||a.name.indexOf('Daniel')>=0||a.name.indexOf('Moira')>=0||a.name.indexOf('Tessa')>=0;
    var bq=b.name.indexOf('Samantha')>=0||b.name.indexOf('Karen')>=0||b.name.indexOf('Daniel')>=0||b.name.indexOf('Moira')>=0||b.name.indexOf('Tessa')>=0;
    if(aq&&!bq)return -1;if(!aq&&bq)return 1;return a.name.localeCompare(b.name);
  });
  sel.innerHTML=voices.map(function(v){var s=selectedVoice===v.name?' selected':'';return '<option value="'+v.name+'"'+s+'>'+v.name+'</option>'}).join('');
  if(!selectedVoice&&voices.length>0){var b=voices.filter(function(v){return v.name.indexOf('Samantha')>=0});selectedVoice=b.length?b[0].name:voices[0].name;saveVoice(selectedVoice)}
}
function speak(text,btnId,ev){
  if(ev){ev.stopPropagation();ev.preventDefault();}
  if(!window.speechSynthesis)return;window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=ttsRate;u.pitch=1.0;
  var voices=cachedVoices.length>0?cachedVoices:loadVoices();
  var vv=voices.filter(function(v){return v.name===selectedVoice});if(vv.length)u.voice=vv[0];
  var btn=btnId?document.getElementById(btnId):null;if(btn)btn.classList.add('speaking');
  u.onend=u.onerror=function(){if(btn)btn.classList.remove('speaking')};window.speechSynthesis.speak(u);
}
function speakSm(btn,ev){
  if(ev){ev.stopPropagation();ev.preventDefault();}
  var text=btn.getAttribute('data-text');if(!text||!window.speechSynthesis)return;
  window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=ttsRate;u.pitch=1.0;
  var voices=cachedVoices.length>0?cachedVoices:loadVoices();
  var vv=voices.filter(function(v){return v.name===selectedVoice});if(vv.length)u.voice=vv[0];
  btn.classList.add('speaking');u.onend=u.onerror=function(){btn.classList.remove('speaking')};
  window.speechSynthesis.speak(u);
}

// Tab switching
var currentTab='learn';
function switchTab(name){
  currentTab=name;
  document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('on')});
  var map={learn:0,review:1,words:2,add:3};
  document.querySelectorAll('.nav-tab')[map[name]].classList.add('on');
  document.querySelectorAll('.pane').forEach(function(p){p.classList.remove('on')});
  document.getElementById('pane-'+name).classList.add('on');
  if(name==='words')renderList();if(name==='learn')renderLearn();if(name==='review')renderReview();
}

function getPosClass(pos){if(!pos)return'other';var p=pos.replace('.','');return ['n','v','adj','adv','prep','conj','pron','art','int'].indexOf(p)>=0?p:'other';}

// ═══ LEARN MODE with SPELLING ═══
var learnCur=null;var learnAttempts=0;
function renderLearn(){
  var w=load();var td=getTodayReviewed();
  var fresh=w.filter(function(x){return x.level===0 && x.timesReviewed===0});
  if(fresh.length===0){document.getElementById('learn').innerHTML='<div class="done-state"><div class="emoji">🎓</div><h3>没有新词了！</h3><p>所有单词都至少学过一遍<br>去「复习」页面巩固吧</p></div>';return;}
  shuffle(fresh);var pool=fresh.slice(0,learnDaily);
  var doneAll=td.length;
  if(doneAll>=pool.length){document.getElementById('learn').innerHTML='<div class="done-state"><div class="emoji">🎉</div><h3>今日新词学完了！</h3><p>已学 '+doneAll+'/'+pool.length+' 个</p></div>';return;}
  learnCur=pool[doneAll];learnAttempts=0;
  var dots='';for(var i=0;i<pool.length;i++){var cls='dot';if(i<doneAll)cls+=' done';if(i===doneAll)cls+=' cur';dots+='<div class="'+cls+'"></div>';}
  var pc=getPosClass(learnCur.pos);
  var el=document.getElementById('learn');
  el.innerHTML='<div class="progress"><div class="n">'+(doneAll+1)+' / '+pool.length+'</div><div class="l">今日新词</div></div><div class="dots">'+dots+'</div><div class="card-scene"><div class="card-wrap"><div class="card flipped" id="lfc" onclick="document.getElementById(\'lfc\').classList.toggle(\'flipped\')"><div class="card-face card-front"><span class="card-pos '+pc+'">'+(learnCur.pos||'')+'</span><div class="card-word">'+learnCur.en+'</div><div class="card-phonetic">'+(learnCur.phonetic||'')+'</div><button class="btn-voice" id="lvc" onclick="speak(\''+learnCur.en.replace(/'/g,"\\'")+'\',\'lvc\',event)">🔊</button><div class="card-hint">点击卡片查看释义</div></div><div class="card-face card-back" onclick="event.stopPropagation()"><div class="card-zh-main">'+learnCur.zh+'</div>'+(learnCur.example?'<div class="card-ex-block"><div class="card-ex-en">'+learnCur.example.replace(/"/g,'&quot;')+' <button class="btn-voice-sm" data-text="'+learnCur.example.replace(/"/g,'&quot;')+'" onclick="speakSm(this,event)">🔊</button></div>'+(learnCur.example_zh?'<div class="card-ex-zh">'+learnCur.example_zh+'</div>':'')+'</div>':'')+'<div class="spell-area" onclick="event.stopPropagation()"><input class="spell-input" id="si" placeholder="输入英文拼写..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')learnCheck()"><div class="spell-feedback" id="sf"></div><button class="spell-btn" onclick="learnCheck()">✅ 检查</button></div></div></div></div></div><div class="actions"><button class="act act-yes" onclick="learnSkip()" style="opacity:.5;font-size:13px;">跳过此词 ▶</button></div>';
  setTimeout(function(){var inp=document.getElementById('si');if(inp)inp.focus();},300);
}
function learnCheck(){
  if(!learnCur)return;
  var inp=document.getElementById('si');var fb=document.getElementById('sf');if(!inp||!fb)return;
  var typed=inp.value.trim().replace(/\s+/g,' ');
  if(typed.toLowerCase()===learnCur.en.toLowerCase()){
    inp.classList.add('correct');fb.className='spell-feedback ok';fb.textContent='✅ 正确！';
    setTimeout(function(){learnDone();},600);
  }else{
    learnAttempts++;inp.classList.add('wrong');fb.className='spell-feedback err';
    if(learnAttempts>=3){
      fb.textContent='答案是: '+learnCur.en;
      fb.className='spell-feedback show';inp.value=learnCur.en;inp.disabled=true;inp.classList.add('correct');
      var btn=document.querySelector('.spell-btn');if(btn){btn.textContent='知道了';btn.onclick=learnDone;}
    }else{
      fb.textContent='❌ 你输入了: '+typed+' · 再试一次 ('+learnAttempts+'/3)';inp.value='';
      setTimeout(function(){inp.classList.remove('wrong');inp.focus();},400);
    }
  }
}
function learnDone(){
  if(!learnCur)return;var w=load();var wi=w.find(function(x){return x.en===learnCur.en});if(!wi)return;
  wi.level=1;wi.timesReviewed=1;wi.nextReview=Date.now()+SPACED[1]*864e5;
  markToday(wi.en);save(w);learnCur=null;learnAttempts=0;renderLearn();
}
function learnSkip(){
  if(!learnCur)return;var w=load();var wi=w.find(function(x){return x.en===learnCur.en});if(!wi)return;
  wi.level=1;wi.timesReviewed=1;wi.nextReview=Date.now()+SPACED[1]*864e5;
  markToday(wi.en);save(w);learnCur=null;learnAttempts=0;renderLearn();
}

// ═══ REVIEW MODE ═══
var reviewCur=null;
function renderReview(){
  var w=load();var d=due(w);d=d.filter(function(x){return x.level>0 && x.timesReviewed>0});
  if(d.length===0){
    var m=w.filter(function(x){return x.level===5}).length;
    document.getElementById('review').innerHTML='<div class="done-state"><div class="emoji">🎉</div><h3>复习全部完成！</h3><p>已掌握 '+m+' 个词</p><div class="done-stats"><div class="done-stat"><div class="n" style="color:var(--green)">'+m+'</div><div class="l">已掌握</div></div><div class="done-stat"><div class="n" style="color:var(--purple)">'+streak()+'</div><div class="l">连续天</div></div><div class="done-stat"><div class="n" style="color:var(--blue)">'+w.length+'</div><div class="l">总词汇</div></div></div></div>';
    return;
  }
  shuffle(d);reviewCur=d[0];
  var totalDue=d.length;var doneReview=w.filter(function(x){return x.nextReview>Date.now()&&x.level>0}).length;
  var pct=w.filter(function(x){return x.level>0}).length?Math.round(doneReview/(w.filter(function(x){return x.level>0}).length)*100):0;
  var pc=getPosClass(reviewCur.pos);
  var el=document.getElementById('review');
  el.innerHTML='<div class="review-progress"><div class="review-bar"><div class="review-fill" style="width:'+pct+'%"></div></div><div class="review-stats"><span>待复习: '+totalDue+'</span><span>已掌握: '+doneReview+'</span></div></div><div class="card-scene"><div class="card-wrap"><div class="card" id="rfc" onclick="document.getElementById(\'rfc\').classList.toggle(\'flipped\')"><div class="card-face card-front"><span class="card-pos '+pc+'">'+(reviewCur.pos||'')+'</span><div class="card-word">'+reviewCur.en+'</div><div class="card-phonetic">'+(reviewCur.phonetic||'')+'</div><button class="btn-voice" id="rvc" onclick="speak(\''+reviewCur.en.replace(/'/g,"\\'")+'\',\'rvc\',event)">🔊</button><div class="card-hint">点击卡片查看释义</div></div><div class="card-face card-back" onclick="event.stopPropagation()"><div class="card-zh-main">'+reviewCur.zh+'</div>'+(reviewCur.example?'<div class="card-ex-block"><div class="card-ex-en">'+reviewCur.example.replace(/"/g,'&quot;')+' <button class="btn-voice-sm" data-text="'+reviewCur.example.replace(/"/g,'&quot;')+'" onclick="speakSm(this,event)">🔊</button></div>'+(reviewCur.example_zh?'<div class="card-ex-zh">'+reviewCur.example_zh+'</div>':'')+'</div>':'')+'<div class="card-meta">复习 '+reviewCur.timesReviewed+' 次 · '+LVL[reviewCur.level]+'</div></div></div></div></div><div class="actions"><button class="act act-no" onclick="reviewAnswer(0)">不认识</button><button class="act act-maybe" onclick="reviewAnswer(1)">模糊</button><button class="act act-yes" onclick="reviewAnswer(2)">认识</button></div>';
}
function reviewAnswer(type){
  if(!reviewCur)return;var w=load();var wi=w.find(function(x){return x.en===reviewCur.en});if(!wi)return;
  if(type===0)wi.level=1;else if(type===1){} else wi.level=Math.min(5,wi.level+1);
  wi.timesReviewed++;wi.nextReview=Date.now()+SPACED[wi.level]*864e5;
  save(w);reviewCur=null;renderReview();
}

// ═══ WORD LIST with PAGINATION ═══
var listPage=1;var PER_PAGE=30;
function renderList(resetPage){
  if(resetPage)listPage=1;
  var w=load();var q=(document.getElementById('sq')||{}).value||'';q=q.toLowerCase();
  var pf=(document.getElementById('pf')||{}).value||'all';
  var f=q?w.filter(function(x){return x.en.toLowerCase().indexOf(q)>-1||x.zh.indexOf(q)>-1}):w;
  if(pf!=='all'){f=f.filter(function(x){return (x.pos||'').replace('.','')===pf});}

  // Build flat list with POS info
  var groups={};f.forEach(function(x,i){var p=(x.pos||'?').replace('.','');if(!groups[p])groups[p]=[];groups[p].push({w:x,idx:w.indexOf(x)});});
  var flatItems=[];
  POS_ORDER.forEach(function(p){
    if(!groups[p]||groups[p].length===0)return;
    flatItems.push({type:'header',pos:p,count:groups[p].length});
    groups[p].forEach(function(item){flatItems.push({type:'word',data:item});});
  });

  var totalPages=Math.max(1,Math.ceil((flatItems.length-POS_ORDER.filter(function(p){return groups[p]}).length)/PER_PAGE));
  if(listPage>totalPages)listPage=totalPages;
  if(listPage<1)listPage=1;

  // Only show words, headers appear when needed
  var start=(listPage-1)*PER_PAGE;var end=start+PER_PAGE;
  var wordCount=0;var html='';var lastPos='';
  for(var i=0;i<flatItems.length;i++){
    var item=flatItems[i];
    if(item.type==='header'){lastPos=item.pos;continue}
    if(wordCount>=start&&wordCount<end){
      // Show header if first word of this POS in this page
      if(wordCount===start||flatItems[i-1]&&flatItems[i-1].type==='header'){
        html+='<div class="pos-title">'+POS_LABELS[lastPos]+' ('+groups[lastPos].length+')</div>';
      }
      var x=item.data.w,idx=item.data.idx;
      html+='<div class="word-item"><div style="min-width:0;"><div class="en">'+x.en+'<span class="ph">'+(x.phonetic||'')+'</span></div><div class="zh">'+x.zh+'</div>'+(x.example?'<div class="ex-line">'+x.example+(x.example_zh?' · '+x.example_zh:'')+'</div>':'')+'</div><div class="meta"><span class="word-tag l'+x.level+'">'+LVL[x.level]+'</span><button class="word-del" onclick="delWord('+idx+')">✕</button></div></div>';
    }
    wordCount++;
  }
  if(!html)html='<div class="done-state"><div class="emoji">📭</div><h3>没有匹配的单词</h3></div>';
  document.getElementById('list').innerHTML=html;

  // Update pager
  var pi=document.getElementById('page-info');if(pi)pi.textContent=listPage+' / '+totalPages;
  var btns=document.querySelectorAll('.pager-btn');if(btns.length>=3){btns[0].disabled=listPage<=1;btns[1].disabled=listPage>=totalPages;}
  var jp=document.getElementById('jump-page');if(jp){jp.max=totalPages;jp.value='';}
}
function prevPage(){if(listPage>1){listPage--;renderList();document.getElementById('list').scrollTop=0;}}
function nextPage(){listPage++;renderList();document.getElementById('list').scrollTop=0;}
function jumpPage(){var jp=document.getElementById('jump-page');var n=parseInt(jp.value);if(n>=1){listPage=n;renderList();document.getElementById('list').scrollTop=0;}}
function delWord(i){if(!confirm('删除？'))return;var w=load();if(learnCur&&w[i]&&w[i].en===learnCur.en)learnCur=null;if(reviewCur&&w[i]&&w[i].en===reviewCur.en)reviewCur=null;w.splice(i,1);save(w);renderList();renderLearn();renderReview();}

// ═══ ADD ═══
function addWord(){
  var en=document.getElementById('ae').value.trim();var zh=document.getElementById('az').value.trim();
  if(!en||!zh){alert('英文和中文必填');return}
  var w=load();if(w.some(function(x){return x.en.toLowerCase()===en.toLowerCase()})){alert('已存在');return}
  var pos=document.getElementById('apos').value.trim()||'n.';
  w.push({en:en,zh:zh,example:document.getElementById('ax').value.trim(),example_zh:document.getElementById('axz').value.trim(),phonetic:document.getElementById('ap').value.trim(),pos:pos,level:0,nextReview:0,timesReviewed:0});
  save(w);['ae','az','ax','axz','ap','apos'].forEach(function(id){document.getElementById(id).value=''});document.getElementById('ae').focus();renderLearn();renderReview();renderList();
}
function resetAll(){
  if(!confirm('重置全部？不可撤销！'))return;
  var keys=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf('wv4_')===0)keys.push(k)}
  keys.forEach(function(k){localStorage.removeItem(k)});learnCur=null;reviewCur=null;renderLearn();renderReview();renderList();
}

function toggleSettings(){
  document.getElementById('settings').classList.toggle('show');
  if(document.getElementById('settings').classList.contains('show')){
    setTimeout(populateVoices,100);document.getElementById('so-voice').value=selectedVoice;
    document.getElementById('so-learn').value=learnDaily;document.getElementById('so-rate').value=ttsRate;
  }
}
function onVoiceChange(v){saveVoice(v)}
function onLearnChange(v){saveLearn(v)}
function onRateChange(v){saveRate(parseFloat(v)||1.0)}

function init(){
  if(window.speechSynthesis){
    window.speechSynthesis.onvoiceschanged=function(){loadVoices();if(!selectedVoice&&cachedVoices.length>0){var b=cachedVoices.filter(function(v){return v.name.indexOf('Samantha')>=0});selectedVoice=b.length?b[0].name:cachedVoices[0].name;saveVoice(selectedVoice)}};
    window.speechSynthesis.getVoices();setTimeout(function(){loadVoices();if(!selectedVoice&&cachedVoices.length>0){var b=cachedVoices.filter(function(v){return v.name.indexOf('Samantha')>=0});selectedVoice=b.length?b[0].name:cachedVoices[0].name;saveVoice(selectedVoice)}},500);
  }
  renderLearn();
}
streak();init();
</script>
